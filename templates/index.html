<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

{% extends 'base.html' %}
{% block content %}
<h2>Users</h2>
<ul class="user-list">
    {% for user in users %}
    <li class="user-entry">
        {{ user.name }}

        <form method="get"
              action="{{ url_for('get_movies', user_id=user.id) }}"
              style="display:inline">
            <button type="submit" class="btn delete">View Movies</button>
        </form>

        <form method="post"
              action="{{ url_for('update_username', user_id=user.id) }}"
              style="display:inline">
            <input type="text" name="name" placeholder="New name">
            <button type="submit" class="btn">Rename User</button>
        </form>

        <form method="post"
              action="{{ url_for('delete_user', user_id=user.id) }}"
              style="display:inline"
              onsubmit="return confirm('Are you sure you want to delete {{ user.name }} and all the movies?');">
            <button type="submit" class="btn delete">Delete User</button>
        </form>

    </li>
    {% endfor %}
</ul>

<form action="{{ url_for('create_user') }}" method="post">
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    <button type="submit">Create User</button>
</form>
{% endblock %}

</body>
</html>
