<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<a href="/">Home</a>
<h2>{{ user.name }}'s Movie Library</h2>

<form method="post" action="{{ url_for('add_movie', user_id=user.id) }}">
    <input type="text" name="title" placeholder="Movie title">
    <button type="submit">Add Movie</button>
</form>
<hr>
{% if movies %}
    {% for movie in movies %}
        <div>
            <h3>{{ movie.title }}</h3>
            <p>{{ movie.director }}</p>
            <p>{{ movie.year }}</p>

            {% if movie.poster_url %}
                <img src="{{ movie.poster_url }}" alt="Poster of {{ movie.title }}">
            {% else %}
                <img src="{{ url_for('static', filename='img/no-image-available.png') }}"
                     alt="No poster available for this movie">
            {% endif %}

            <form method="post"
                  action="{{ url_for('update_movie_title', user_id=user.id, movie_id=movie.id) }}">
                <label for="title-{{ movie.id }}">New title:</label>
                <input id="title-{{ movie.id }}" type="text" name="title" value="{{ movie.title }}">
                <button type="submit">Update</button>
            </form>

            <form method="post"
                  action="{{ url_for('delete_movie', user_id=user.id, movie_id=movie.id) }}"
                  onsubmit="return confirm('Are you sure you want to delete this movie?');">
                <button type="submit">Delete</button>
            </form>
        </div>
    {% endfor %}
{% else %}
    <p>No movies found.</p>
    <a href="{{ url_for('index') }}" class="btn">Back to Homepage</a>
{% endif %}
</body>
</html>
