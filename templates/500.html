<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>500 Internal Error</title>
</head>
<body>
    {%extends "base.html" %}
  {% block content %}

      <h2>500 - Internal Server Error</h2>

      <a href="{{ url_for('index') }}" class="btn">Back to Homepage</a>
    </div>
  {% endblock %}
</body>
</html>
