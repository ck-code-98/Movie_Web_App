<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Base Template</title>
</head>
<body>
  <h1>Movie Web App</h1>

  {% with msgs = get_flashed_messages(with_categories=True) %}
  {% if msgs %}
      <div class="flash-container">
          {% for cat, msg in msgs %}
          <div class="flash {{ cat }}">{{ msg }}</div>
          {% endfor %}
      </div>
  {% endif %}
  {% endwith %}

  <main class="container">
      {% block content %}{% endblock %}
  </main>

<script>
    function showRenameForm(id, type) {
    document.getElementById(`rename-form-${type}-${id}`).style.display = 'inline-block';
    }

    function hideRenameForm(id, type) {
    document.getElementById(`rename-form-${type}-${id}`).style.display = 'none';
    }
</script>

</body>
</html>
